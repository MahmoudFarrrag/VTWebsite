name: Deploy Angular site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Angular application
        run: npm run build -- --configuration production --base-href /VTWebsite/
      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          output="dist/new-vt-website/browser"
          test -f "$output/index.html"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.join('dist', 'new-vt-website', 'browser');
          const walk = dir => fs.readdirSync(dir, {withFileTypes:true}).flatMap(entry => {
            const file = path.join(dir, entry.name);
            return entry.isDirectory() ? walk(file) : [file];
          });
          for (const file of walk(root).filter(file => /\.(html|js|css)$/.test(file))) {
            const original = fs.readFileSync(file, 'utf8');
            const updated = original.replaceAll('"/assets/', '"assets/').replaceAll("'/assets/", "'assets/");
            if (updated !== original) fs.writeFileSync(file, updated);
          }
          NODE
          cp "$output/index.html" "$output/404.html"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/new-vt-website/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
